name: Refactor keyboards once

on:
  push:
    branches: [refactor/extract-keyboards]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-keyboards
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python .github/scripts/refactor_keyboards_once.py
      - run: python -m compileall -q handlers.py keyboard.py
      - name: Commit refactor
        run: |
          rm .github/scripts/refactor_keyboards_once.py
          rm .github/workflows/refactor-keyboards-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add handlers.py keyboard.py .github/scripts/refactor_keyboards_once.py .github/workflows/refactor-keyboards-once.yml
          git commit -m "refactor: wire handlers to keyboard module"
          git push origin HEAD:refactor/extract-keyboards
