name: Serverless static checks
on:
  push:
    branches: [serverless]
  pull_request:
    paths:
      - 'tgcloud/**'
      - 'tests/serverless/**'
      - 'tests/video/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/serverless-check.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned CLI
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run syntax, SQLite-backed behavior, parity, and capability tests
        run: npm run check
